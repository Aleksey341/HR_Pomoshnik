name: Test and build HR Pomoshnik

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Node dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run Python tests
        run: PYTHONPATH=. python -m pytest -q

      - name: Check managed gateway JavaScript
        run: |
          node --check 'api/[...path].js'
          node --check api/_lib/managed.js
          node --check api/_lib/blob-store.js
          node --check api/_lib/usage.js
          node --check api/_lib/research-store.js
          node --check api/_lib/monitor-store.js
          node --check api/_lib/monitor-runner.js
          node --check api/access/check.js
          node --check api/ai/analyze.js
          node --check api/firecrawl/search.js
          node --check api/firecrawl/scrape.js
          node --check api/firecrawl/crawl.js
          node --check api/firecrawl/get.js
          node --check api/firecrawl/credits.js
          node --check api/health.js
          node --check static/js/config.js
          node --check static/js/api.js
          node --check static/js/ai.js
          node --check static/js/app.js
          node --check static/js/friendly-ui.js
          node --check static/js/results.js
          node --check static/js/export.js
          node --check static/js/legacy.js
          node --check static/js/markdown.js
          node --check static/js/history.js
          node --check static/js/research-planner.js
          node --check static/js/usage.js
          node --check static/js/quality.js
          node --check static/js/hr-playbooks.js
          node --check static/js/report-formats.js
          node --check static/js/monitoring.js
          node --check static/js/state.js
          node --check static/js/research.js
          node --check static/js/retry-policy.js

      - name: Verify Node runtime dependencies
        run: node -e "import('@vercel/blob').then(() => console.log('Vercel Blob SDK resolved'))"

      - name: Run Node tests
        run: node --test tests/managed-access.test.mjs tests/evidence-quality.test.mjs tests/rate-limit.test.mjs

      - name: Reject committed API secrets
        shell: bash
        run: |
          if grep -RInE --exclude-dir=.git --exclude-dir=node_modules --exclude='*.md' --exclude='.env.example' \
            '(sk-[A-Za-z0-9_-]{20,}|fc-[A-Za-z0-9_-]{20,})' .; then
            echo 'Possible API secret committed to repository'
            exit 1
          fi

      - name: Build static site
        run: python scripts/build_static.py

      - name: Commit generated docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs static/js/plate-pattern.js
          if git diff --cached --quiet; then
            echo "Generated files are current"
          else
            git commit -m "Build HR Pomoshnik static site"
            git push origin main
          fi
name: Test and build HR Pomoshnik

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python tests
        run: pytest -q

      - name: Check managed gateway JavaScript
        run: |
          node --check api/_lib/managed.js
          node --check api/ai/analyze.js
          node --check api/firecrawl/search.js
          node --check api/firecrawl/scrape.js
          node --check api/firecrawl/crawl.js
          node --check api/firecrawl/get.js
          node --check api/health.js
          node --check static/js/config.js
          node --check static/js/api.js
          node --check static/js/ai.js
          node --check static/js/app.js

      - name: Run managed access tests
        run: node --test tests/managed-access.test.mjs

      - name: Build static site
        run: python scripts/build_static.py

      - name: Commit generated docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs static/js/plate-pattern.js
          if git diff --cached --quiet; then
            echo "Generated files are current"
          else
            git commit -m "Build HR Pomoshnik static site"
            git push origin main
          fi
